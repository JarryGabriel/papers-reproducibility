[project]
name = "plateau-calibration"
version = "1.0.0"
description = "Calibrating plateau detectors in ADS-B data without ground truth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Gabriel Jarry", email = "gabriel.jarry@eurocontrol.int" },
    { name = "Ramon Dalmau", email = "ramon.dalmau-codina@eurocontrol.int" },
    { name = "Philippe Very" },
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.0",
    "matplotlib>=3.9",
    "ruptures>=1.1.9",
    "PyYAML>=6",
]

[project.optional-dependencies]
replay = ["cyclopts", "deltalake", "pyarrow", "pyModeS", "node-fdm-pipeline[traffic]"]

# Public node-fdm-v2 snapshot; pin every workspace member to the same revision.
[tool.uv.sources]
node-fdm-pipeline = { git = "https://github.com/eurocontrol-asu/node-fdm.git", rev = "f2660be4b5632f4d6554f50a1508da055eca44fe", subdirectory = "packages/node-fdm-pipeline" }
node-fdm-data = { git = "https://github.com/eurocontrol-asu/node-fdm.git", rev = "f2660be4b5632f4d6554f50a1508da055eca44fe", subdirectory = "packages/node-fdm-data" }
node-fdm = { git = "https://github.com/eurocontrol-asu/node-fdm.git", rev = "f2660be4b5632f4d6554f50a1508da055eca44fe", subdirectory = "packages/node-fdm" }
node-fdm-models = { git = "https://github.com/eurocontrol-asu/node-fdm.git", rev = "f2660be4b5632f4d6554f50a1508da055eca44fe", subdirectory = "packages/node-fdm-models" }
node-fdm-bada = { git = "https://github.com/eurocontrol-asu/node-fdm.git", rev = "f2660be4b5632f4d6554f50a1508da055eca44fe", subdirectory = "packages/node-fdm-bada" }

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
opensky26 = "opensky26_plateau.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensky26_plateau"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RUF"]
ignore = ["N806", "N812", "N811", "E741"]
